<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — NASIEKU'S STORE</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-box">
    <h1>Admin Login</h1>
    <p class="sub">Store dashboard access — staff only.</p>
    <div class="auth-error" id="loginError" style="display:none;background:#FBEAE3;color:var(--rust-dark);padding:12px 14px;border-radius:var(--radius-s);font-size:.86rem;margin-bottom:18px;"></div>
    <form id="adminLoginForm">
      <div class="field">
        <label for="aEmail">Email</label>
        <input type="email" id="aEmail" required placeholder="you@nasiekus.co.ke">
      </div>
      <div class="field">
        <label for="aPass">Password</label>
        <input type="password" id="aPass" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Log In</button>
    </form>
    <p style="text-align:center;font-size:.82rem;margin-top:20px;"><a href="index.html" style="text-decoration:underline;color:var(--ink-soft);">&larr; Back to store</a></p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script>
(function(){
  // If already logged in as admin, skip straight to the dashboard.
  const existing = getStoredUser();
  if (existing && existing.role === "admin"){
    window.location.href = "admin-dashboard.html";
  }

  document.getElementById("adminLoginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById("loginError");
    errorBox.style.display = "none";

    const email = document.getElementById("aEmail").value;
    const password = document.getElementById("aPass").value;
    const btn = document.getElementById("loginBtn");
    btn.disabled = true; btn.textContent = "Logging in…";

    try{
      const res = await fetch(apiUrl("/api/auth/login"), {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Could not log in.");
      if (data.user.role !== "admin"){
        throw new Error("This account doesn't have admin access.");
      }
      setSession(data.token, data.user);
      window.location.href = "admin-dashboard.html";
    }catch(err){
      errorBox.textContent = err.message;
      errorBox.style.display = "block";
      btn.disabled = false; btn.textContent = "Log In";
    }
  });
})();
</script>
</body>
</html>
